<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes on the Wall</title>
<style>
  :root {
    --bg: #f4f1ea;
    --card: #fffdf7;
    --ink: #2b2b2b;
    --muted: #8a8478;
    --accent: #e0575b;
    --accent-2: #4a7c6f;
    --border: #e5ddc9;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
  }

  header {
    padding: 28px 20px 18px;
    text-align: center;
    border-bottom: 1px solid var(--border);
    background: var(--card);
  }

  header h1 {
    margin: 0 0 4px;
    font-size: 1.6rem;
    letter-spacing: -0.02em;
  }

  header p {
    margin: 0;
    color: var(--muted);
    font-size: 0.9rem;
  }

  .demo-banner {
    background: #fff4d6;
    border-bottom: 1px solid #eaddaa;
    color: #7a5c00;
    text-align: center;
    font-size: 0.8rem;
    padding: 6px 12px;
  }

  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 16px 80px;
  }

  .composer {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    margin-bottom: 28px;
  }

  .composer .name-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
    font-size: 0.85rem;
    color: var(--muted);
  }

  .composer .name-row input {
    border: none;
    border-bottom: 1px dashed var(--border);
    background: transparent;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--accent-2);
    padding: 2px 4px;
    width: 160px;
  }

  .composer .name-row input:focus {
    outline: none;
    border-bottom-color: var(--accent-2);
  }

  .composer textarea {
    width: 100%;
    min-height: 70px;
    resize: vertical;
    border: none;
    font-family: inherit;
    font-size: 1rem;
    line-height: 1.4;
    padding: 4px;
  }

  .composer textarea:focus {
    outline: none;
  }

  .composer-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 10px;
  }

  .char-count {
    font-size: 0.75rem;
    color: var(--muted);
  }

  button.post-btn {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 999px;
    padding: 9px 20px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s ease, opacity 0.15s ease;
  }

  button.post-btn:hover { opacity: 0.9; }
  button.post-btn:active { transform: scale(0.97); }
  button.post-btn:disabled {
    background: #ccc;
    cursor: not-allowed;
  }

  .wall {
    display: grid;
    gap: 14px;
  }

  .note {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    animation: fadeIn 0.25s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .note-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
    gap: 10px;
  }

  .note-author {
    font-weight: 700;
    color: var(--accent-2);
    font-size: 0.9rem;
  }

  .note-time {
    font-size: 0.75rem;
    color: var(--muted);
    white-space: nowrap;
  }

  .note-body {
    font-size: 0.98rem;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .empty-state {
    text-align: center;
    color: var(--muted);
    padding: 40px 20px;
    font-size: 0.9rem;
  }

  .reset-link {
    display: block;
    text-align: center;
    margin-top: 30px;
    font-size: 0.75rem;
    color: var(--muted);
    cursor: pointer;
    text-decoration: underline;
  }
</style>
</head>
<body>

<div class="demo-banner">
  Demo mode — messages are only stored in your own browser (localStorage), not shared with other visitors yet.
</div>

<header>
  <h1>📌 Notes on the Wall</h1>
  <p>Leave a note. Sign it however you like.</p>
</header>

<main>
  <div class="composer">
    <div class="name-row">
      Posting as
      <input type="text" id="usernameInput" placeholder="pick a name" maxlength="24">
    </div>
    <textarea id="messageInput" placeholder="What's on your mind?" maxlength="500"></textarea>
    <div class="composer-footer">
      <span class="char-count" id="charCount">500 left</span>
      <button class="post-btn" id="postBtn">Post</button>
    </div>
  </div>

  <div class="wall" id="wall"></div>
  <div class="empty-state" id="emptyState">No notes yet. Be the first to post one.</div>

  <span class="reset-link" id="resetLink">clear all notes (local demo reset)</span>
</main>

<script>
  const STORAGE_KEY = 'notesWall.messages';
  const USERNAME_KEY = 'notesWall.username';

  const usernameInput = document.getElementById('usernameInput');
  const messageInput = document.getElementById('messageInput');
  const postBtn = document.getElementById('postBtn');
  const wall = document.getElementById('wall');
  const emptyState = document.getElementById('emptyState');
  const charCount = document.getElementById('charCount');
  const resetLink = document.getElementById('resetLink');

  // In-memory fallback used when localStorage is unavailable (private
  // browsing, some file:// contexts, sandboxed iframes, etc.) so posting
  // still works even though it won't persist across reloads in that case.
  let memoryMessages = [];
  let storageAvailable = true;

  function loadMessages() {
    if (!storageAvailable) return memoryMessages;
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch {
      storageAvailable = false;
      return memoryMessages;
    }
  }

  function saveMessages(messages) {
    if (storageAvailable) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
        return;
      } catch {
        storageAvailable = false;
      }
    }
    memoryMessages = messages;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function timeAgo(timestamp) {
    const diff = Math.floor((Date.now() - timestamp) / 1000);
    if (diff < 60) return 'just now';
    if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
    if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
    return new Date(timestamp).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }

  function render() {
    const messages = loadMessages();
    wall.innerHTML = '';
    emptyState.style.display = messages.length ? 'none' : 'block';

    messages
      .slice()
      .sort((a, b) => b.timestamp - a.timestamp)
      .forEach(msg => {
        const note = document.createElement('div');
        note.className = 'note';
        note.innerHTML = `
          <div class="note-header">
            <span class="note-author">${escapeHtml(msg.author)}</span>
            <span class="note-time">${timeAgo(msg.timestamp)}</span>
          </div>
          <div class="note-body">${escapeHtml(msg.text)}</div>
        `;
        wall.appendChild(note);
      });
  }

  function updateCharCount() {
    const remaining = 500 - messageInput.value.length;
    charCount.textContent = `${remaining} left`;
  }

  function postMessage() {
    const text = messageInput.value.trim();
    if (!text) return;

    let author = usernameInput.value.trim();
    if (!author) author = 'Anonymous';

    try { localStorage.setItem(USERNAME_KEY, author); } catch {}

    const messages = loadMessages();
    messages.push({
      author,
      text,
      timestamp: Date.now()
    });
    saveMessages(messages);

    messageInput.value = '';
    updateCharCount();
    render();
  }

  postBtn.addEventListener('click', postMessage);

  messageInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) {
      postMessage();
    }
  });

  messageInput.addEventListener('input', updateCharCount);

  resetLink.addEventListener('click', () => {
    if (confirm('Clear all notes stored in this browser?')) {
      localStorage.removeItem(STORAGE_KEY);
      render();
    }
  });

  // Init
  let savedUsername = null;
  try { savedUsername = localStorage.getItem(USERNAME_KEY); } catch {}
  if (savedUsername) usernameInput.value = savedUsername;
  updateCharCount();
  render();
</script>

</body>
</html>
